        <script>
            (function () {
                function injectOrKeepBadge() {
                    // Remove Emergent badge if re-injected
                    var e = document.getElementById("emergent-badge");
                    if (e) e.remove();
                    var ua = document.querySelectorAll('a[href*="utm_source=emergent-badge"]');
                    ua.forEach(function (a) { a.remove(); });
                    // Ensure our badge is present (anchor element)
                    if (!document.getElementById("meandyou-badge")) {
                        var a = document.createElement("a");
                        a.id = "meandyou-badge";
                        a.href = "/";
                        a.setAttribute("aria-label", "me&you");
                        a.innerHTML = '<span class="w">me</span><span class="amp">&amp;</span><span class="w">you</span>';
                        document.body.appendChild(a);
                    }
                }
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", injectOrKeepBadge);
                } else { injectOrKeepBadge(); }
                // Observe DOM for re-injection
                var obs = new MutationObserver(function () { injectOrKeepBadge(); });
                obs.observe(document.documentElement, { childList: true, subtree: true });
                // Safety net
                setInterval(injectOrKeepBadge, 1500);
            })();
        </script>
